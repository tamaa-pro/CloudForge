
name: Build CloudForge
on: [push, workflow_dispatch]
jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      CF_CLIENT_ID: ${{ vars.CF_CLIENT_ID }}  
      KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KS_PASS_S: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KS_ALIAS_S: ${{ secrets.ANDROID_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Prepare signing key
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS_S" ] && [ -n "$KS_ALIAS_S" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/ks.p12"
            echo "KS_PASS=$KS_PASS_S" >> "$GITHUB_ENV"; echo "KS_ALIAS=$KS_ALIAS_S" >> "$GITHUB_ENV"
          else
            P=$(openssl rand -hex 12)
            keytool -genkeypair -keystore "$RUNNER_TEMP/ks.p12" -storetype PKCS12 -storepass "$P" -keypass "$P" \
              -alias cloudforge -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=CloudForge"
            mkdir -p newkey
            printf 'ANDROID_KEYSTORE_PASSWORD=%s\nANDROID_KEY_ALIAS=cloudforge\n' "$P" > newkey/secrets.txt
            base64 -w0 "$RUNNER_TEMP/ks.p12" > newkey/ANDROID_KEYSTORE_BASE64.txt
            echo "KS_PASS=$P" >> "$GITHUB_ENV"; echo "KS_ALIAS=cloudforge" >> "$GITHUB_ENV"; echo "NEW_KEY=true" >> "$GITHUB_ENV"
            echo "::warning::No signing secrets found. Download artifact NEW-SIGNING-KEY and add the 3 secrets, or updates will not install over this build."
          fi
          echo "KS_PATH=$RUNNER_TEMP/ks.p12" >> "$GITHUB_ENV"
      - run: gradle assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: CloudForge-0.4, path: app/build/outputs/apk/release/*.apk }
      - uses: actions/upload-artifact@v4
        if: env.NEW_KEY == 'true'
        with: { name: NEW-SIGNING-KEY, path: newkey/, retention-days: 7 }
